name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake perl pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_release.py'
      - run: python3 scripts/release.py --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Smoke test the release executable
        run: |
          ./target/release/sigma --version
          ./target/release/sigma --help
          ./target/release/sigma chat-hook-add --help
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-linux-x86_64
          path: target/release/sigma

  version:
    needs: [check, landing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the checked source revision
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
      - name: Configure release author
        run: |
          git config user.name 'Sigma CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - id: version
        run: python3 scripts/release.py --write --push --github-output "$GITHUB_OUTPUT"
  release:
    needs: version
    if: needs.version.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
        working-directory: landing
      - run: npm run check
        working-directory: landing
      - run: npm run build
        working-directory: landing
        env:
          BASE_PATH: /sigma
